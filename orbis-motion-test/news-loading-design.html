<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101616"><title>Newsworthy — Loading intro</title><link rel="icon" href="/news-design/newsworthy-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/news-flat.css"><link rel="stylesheet" href="/news-wire.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"><link rel="stylesheet" href="/news-popups.css"><link rel="stylesheet" href="/news-intro.css"><link rel="stylesheet" href="/news-intro-viewfinder.css"><style>
.preview-bar{position:fixed;z-index:50;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#f1f2ee;border-bottom:2px solid #101414;font:700 11px 'Space Mono',monospace}
.preview-bar strong{margin-right:8px}.preview-bar button{padding:7px 10px;background:white;border:1px solid #101414;font:700 11px 'Space Mono',monospace;cursor:pointer}
.preview-bar button[aria-pressed=true]{background:#101414;color:white}#preview-clock{margin-left:auto;color:#666861}
#game{position:fixed;inset:52px 0 0;height:auto;min-height:0}#game .broadcast{position:absolute;inset:0}#game .picture-stage{inset:0}
</style></head>
<body><nav class="preview-bar" aria-label="Loading preview"><strong>LOADING INTRO</strong>
<button data-look="viewfinder" aria-pressed="true">Look: Viewfinder</button><button data-look="current">Look: Current</button><i style="width:1px;height:22px;background:#101414;margin:0 6px"></i>
<button data-load="2500">Fast load · 2.5s</button><button data-load="6000" aria-pressed="true">Typical · 6s</button><button data-load="16000">Slow · 16s</button><button data-load="error">Error</button><button data-load="busy">Busy retry</button><span id="preview-clock"></span></nav>
<main id="game"><section class="broadcast" aria-label="News camera">
<div class="picture-stage"><video id="feed" autoplay playsinline poster="/news-judge/ordinary.jpg"></video><img id="opening-scene" src="/news-judge/busy-opening-ufo-v4.png" alt="Starting image: a car fire, giant rubber duck and alien flying saucer across downtown streets"><div class="shade"></div><div id="connection" role="status" hidden><div class="vf-osd" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="vf-tl">STBY</span><span class="vf-tr"><span class="vf-battery"><b></b><b></b><b></b></span></span><span class="vf-bl">AUTO</span><span class="vf-cross"></span></div><strong id="connection-title">Something’s happening downtown.</strong><p id="intro-sub" hidden></p><p id="connection-note" hidden></p><button id="retry-connect" hidden>TRY AGAIN</button><button id="release" hidden>STOP PREVIOUS SESSION</button></div><div id="flash"></div>
<div class="on-air"><b>● LIVE</b><span>ORBIS NEWS / CHOPPER 01</span></div>
<div class="stats"><div><small>TIME LEFT</small><strong id="clock">2:00</strong></div><div><small>YOUR EARNINGS</small><strong id="money">$0</strong></div></div>
<button id="sound" aria-pressed="true">SOUND ON</button><div class="viewfinder" id="aim"><span class="shoot-hint">CLICK TO SHOOT</span><small class="shot-count"><b id="remaining">12</b><span id="shots-label"> SHOTS LEFT</span></small><i></i><i></i><i></i><i></i></div>
<div class="capture-zone"><p id="notice" role="status">Find a story. Get the shot. Get paid.</p></div>
</div></section></main>
<script type="module">
import {playIntro,VIEWFINDER_BEATS} from '/newsworthy-intro.js';
const $=s=>document.querySelector(s);let intro,run=0,clock,look='viewfinder',mode='6000';
async function play(m=mode){mode=m;
 const id=++run;intro?.stop();clearInterval(clock);$('#opening-scene').hidden=false;$('#connection-note').hidden=true;$('#retry-connect').hidden=true;$('#release').hidden=true;
 document.querySelectorAll('[data-load]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.load===mode)));document.querySelectorAll('[data-look]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.look===look)));$('#connection').classList.toggle('viewfinder-look',look==='viewfinder');
 const t0=Date.now();clock=setInterval(()=>{const t=Date.now()-t0;$('#preview-clock').textContent=(t/1000).toFixed(1)+'s';},100);
 const opening=intro=playIntro($('#connection'),look==='viewfinder'?{beats:VIEWFINDER_BEATS}:{});
 const loaded=new Promise((ok,fail)=>setTimeout(()=>mode==='error'||mode==='busy'?fail(mode):ok(),isNaN(mode)?4000:+mode));
 try{await Promise.all([loaded,opening.ready]);if(id!==run)return;$('#opening-scene').hidden=true;opening.live();}
 catch(e){if(id!==run)return;opening.stop();const busy=e==='busy';$('#connection-title').textContent=busy?'Almost there.':'Couldn’t reach the city.';$('#connection-note').textContent=busy?'Trying again in 10 seconds.':'Your round hasn’t started. Try again in a moment.';$('#connection-note').hidden=false;$('#retry-connect').hidden=false;}
 finally{if(id===run)clearInterval(clock);}
}
document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>play(b.dataset.load));document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{look=b.dataset.look;play();});$('#retry-connect').onclick=()=>play('6000');
play('6000');
</script></body></html>
