<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Newsworthy animated live shutter concept</title>
  <desc id="desc">An animated camera-shutter eye locks focus and flashes like an opening ident.</desc>
  <style>
    .blades{transform-origin:256px 256px;animation:shutter 3.2s cubic-bezier(.7,0,.2,1) infinite}
    .flash{animation:flash 3.2s steps(1,end) infinite}
    .finder{transform-origin:256px 256px;animation:lock 3.2s cubic-bezier(.2,.8,.2,1) infinite}
    @keyframes shutter{0%,48%,100%{transform:rotate(0)}58%,66%{transform:rotate(30deg)}}
    @keyframes flash{0%,57%,60%,100%{opacity:0}58%{opacity:1}}
    @keyframes lock{0%,25%{transform:scale(1.09)}42%,100%{transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){.blades,.flash,.finder{animation:none}}
  </style>
  <rect width="512" height="512" rx="104" fill="#101820"/>
  <path d="M45 256c60-96 127-144 211-144s151 48 211 144c-60 96-127 144-211 144S105 352 45 256Z" fill="#e8e0cf"/>
  <path d="M108 256c43-58 92-87 148-87s105 29 148 87c-43 58-92 87-148 87s-105-29-148-87Z" fill="#101820"/>
  <g class="blades">
    <circle cx="256" cy="256" r="94" fill="#d9362b"/>
    <g fill="none" stroke="#101820" stroke-width="17">
      <path d="M256 215h71"/><path d="m292 235 35 62"/><path d="m292 277-36 61"/>
      <path d="M256 297h-71"/><path d="m220 277-35-62"/><path d="m220 235 36-61"/>
    </g>
    <path d="m256 208 42 24v48l-42 24-42-24v-48Z" fill="#e8e0cf"/>
  </g>
  <g class="finder" fill="none" stroke="#d9362b" stroke-width="25">
    <path d="M70 182v-72h72M442 182v-72h-72M70 330v72h72M442 330v72h-72"/>
  </g>
  <rect class="flash" width="512" height="512" rx="104" fill="#f4f0e6" opacity="0"/>
</svg>
