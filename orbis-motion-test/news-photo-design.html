<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsworthy — Photo views</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#142d48;font-family:Barlow,Arial}header{border-top:5px solid #e6372f;background:#f8f4ea;padding:20px 28px;display:flex;align-items:center;gap:24px}header b{font:900 italic 30px 'Barlow Condensed'}header span{font-size:11px;letter-spacing:1px}nav,.selector{display:flex;gap:8px;flex-wrap:wrap;padding:14px 28px}button,select{font:700 12px Barlow;padding:10px 14px;background:#fff;border:1px solid #c8cdd1;color:#142d48;cursor:pointer}button[aria-pressed=true],.primary{background:#154bae;color:#fff;border-color:#154bae}button:focus-visible{outline:3px solid #e6ad2a;outline-offset:3px}.selector{align-items:center;padding-top:0}.selector span{font-size:12px}.stage{padding:28px;min-height:650px;background:linear-gradient(#142d4833,#142d4877),url('/news-judge/busy-opening.png') center/cover;display:flex;align-items:flex-start;justify-content:center}.panel{background:#f8f4ea;width:min(580px,100%);box-shadow:5px 5px 0 #154bae}.bar{background:#154bae;color:#fff;padding:11px 16px;display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.6px}.image{position:relative}.image img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.price{position:absolute;right:12px;bottom:12px;padding:7px 12px;font:800 36px/1 'Barlow Condensed';background:var(--accent);color:var(--ink)}.copy{padding:18px 22px}.copy h2{font:700 20px/1.25 Barlow;margin:0}.repeat{display:inline-block;vertical-align:middle;margin-left:5px;font:700 8px/1 Barlow;background:#e6e8e5;color:#62717d;border-radius:3px;padding:4px 5px}.primary{width:100%;margin-top:18px}.pending{font:600 15px Barlow;margin:0}.roll{width:235px;background:#f8f4ea;padding-bottom:12px}.roll .bar{background:#f8f4ea;color:#142d48;border-bottom:1px solid #ccc}.tile{padding:0;border:1px solid #d3d6d4;background:#fff;display:block;text-align:left;width:100%;color:#142d48}.roll .tile{width:calc(100% - 20px);margin:10px}.tile .copy{padding:11px}.tile h2{font-size:15px;line-height:1.25}.tile .price{font-size:27px;padding:6px 9px;right:8px;bottom:8px}.result-card{width:330px}.viewer{width:min(920px,100%)}.viewer-body{display:grid;grid-template-columns:1.4fr 1fr}.viewer .image img{height:100%;object-fit:contain;background:#122436}.viewer .copy h2{font-size:22px}.explanation{font-size:13px;line-height:1.5;color:#596b7c}.grades{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #d5d9d9;border-bottom:1px solid #d5d9d9;padding:12px 0;margin:18px 0;gap:10px}.grades small{font-size:10px;display:block}.grades b{font-size:15px;display:block;margin-top:4px}.math{font-size:12px;line-height:1.6}.math strong{font-size:22px;color:#154bae;display:block}.viewer-footer{display:flex;justify-content:space-between;padding:12px 16px;gap:10px}.empty{padding:30px;background:#fff}@media(max-width:700px){.viewer-body{grid-template-columns:1fr}.stage{padding:16px}header{padding:16px}.selector,nav{padding-left:16px;padding-right:16px}}

.payout-popup{width:min(720px,100%)}.payout-popup .image img{max-height:300px;aspect-ratio:auto;object-fit:contain;background:#122436}.payout-popup .copy{padding:24px}.payout-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px}.payout-row h2{font:800 30px/1.12 'Barlow Condensed',Arial;max-width:420px}.payout-number{font:800 68px/1 'Barlow Condensed',Arial;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-1px;min-width:160px;text-align:right}.payout-popup .primary{padding:15px;font-size:13px;margin-top:24px}
@media(max-width:500px){.payout-row{gap:12px}.payout-row h2{font-size:24px}.payout-number{font-size:46px;min-width:110px}.payout-popup .copy{padding:18px}}

.payout-popup .image img{width:100%;height:auto;max-height:none;aspect-ratio:4/3;object-fit:cover;background:transparent}
.payout-popup .copy h2{font:800 30px/1.12 'Barlow Condensed',Arial}
.payout-popup .payout-number{position:absolute;right:16px;bottom:16px;background:var(--accent);color:var(--ink);font-size:68px;padding:12px 18px;min-width:0;box-shadow:3px 3px 0 #0002}
@media(max-width:500px){.payout-popup .payout-number{font-size:48px;padding:9px 12px}.payout-popup .copy h2{font-size:24px}}
.formula-notes{border-top:1px solid #d5d9d9;margin-top:16px;padding-top:4px}.formula-notes p{font:400 12px/1.5 Barlow,Arial;color:#596b7c;margin:10px 0}
.formula-notes{margin-top:12px;padding-top:10px}.formula-notes summary{font:600 11px/1.3 Barlow,Arial;color:#647382;cursor:pointer}.formula-notes p{font-size:11px;line-height:1.4;margin:8px 0}
.stage.payout-backdrop{background-image:linear-gradient(#07111dd9,#07111de6),url('/news-judge/busy-opening.png')}
</style>
<header><b>NEWSWORTHY</b><span>PHOTO VIEWS · DESIGN PREVIEW</span></header>
<nav><button data-view="popup" aria-pressed="true">1 · Payout popup</button><button data-view="roll" aria-pressed="false">2 · Camera roll</button><button data-view="card" aria-pressed="false">3 · Results card</button><button data-view="viewer" aria-pressed="false">4 · Photo viewer</button></nav>
<div class="selector"><button id="prev" aria-label="Previous photo">←</button><span id="position"></span><button id="next" aria-label="Next photo">→</button><button id="pending" aria-pressed="false">Preview sending</button></div>
<section class="stage" id="stage"></section>
<script type="module">
import {results} from './news-photo-preview-data.js';
const shots=JSON.parse(localStorage.getItem('newsworthy-design-shots')||'[]');let index=0,view='popup',pending=false,counterFrame=0;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const money=n=>'$'+n.toLocaleString();
function data(i){const s=shots[i],r=results.find(r=>r.headline===s.headline),g=r.grades,base=Math.round((g.event+g.spectacle)*g.clarity/32*1000)/100,score=Math.round(base*(s.repeat?.5:1)*100)/100;return {...s,r,g,base,score,paid:Math.round(score*100)};}
function tint(node,d){node.style.setProperty('--accent',d.paid>=750?'#dc382d':d.paid>=500?'#f1ba39':d.paid>=250?'#154bae':'#607286');node.style.setProperty('--ink',d.paid>=500&&d.paid<750?'#432e00':'#fff');}
function image(d,showPrice=true){const wrap=el('div','image'),img=new Image();img.src=d.image;img.alt=d.headline;wrap.append(img);if(showPrice)wrap.append(el('strong','price',money(d.paid)));return wrap;}
function title(d){const h=el('h2','',d.headline);if(d.repeat)h.append(el('span','repeat','REPEAT'));return h;}
function switchView(v){view=v;pending=false;render();}
function tile(d){const card=el('button','tile');tint(card,d);const copy=el('div','copy');copy.append(title(d));card.append(image(d),copy);card.onclick=()=>switchView('viewer');card.setAttribute('aria-label','View photo: '+d.headline);return card;}
function countPayout(node,value){cancelAnimationFrame(counterFrame);node.textContent='$0';node.setAttribute('aria-label',money(value)+' earned');if(matchMedia('(prefers-reduced-motion: reduce)').matches){node.textContent=money(value);return;}const start=performance.now();function frame(now){if(!node.isConnected)return;const progress=Math.min(1,(now-start)/1100);node.textContent=money(Math.round(value*(1-Math.pow(1-progress,3))));if(progress<1)counterFrame=requestAnimationFrame(frame);else node.textContent=money(value);}counterFrame=requestAnimationFrame(frame);}
function render(){cancelAnimationFrame(counterFrame);const stage=document.querySelector('#stage');stage.classList.toggle('payout-backdrop',view==='popup');stage.replaceChildren();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.querySelector('#pending').hidden=view!=='popup';document.querySelector('#pending').setAttribute('aria-pressed',pending);document.querySelector('#pending').textContent=pending?'Preview payout':'Preview sending';document.querySelector('#position').textContent='Photo '+(index+1)+' / '+shots.length;if(!shots.length){stage.append(el('p','empty','Open this preview in the same browser as your saved round.'));return;}const d=data(index);
if(view==='roll'){const roll=el('aside','roll');roll.append(el('div','bar','CAMERA ROLL'));roll.append(tile(d));stage.append(roll);return;}
if(view==='card'){const c=tile(d);c.classList.add('result-card');stage.append(c);return;}
const panel=el('article','panel'+(view==='viewer'?' viewer':''));tint(panel,d);const bar=el('div','bar');bar.append(el('span','',view==='viewer'?'YOUR PHOTO':pending?'SENDING TO EDITOR…':'PHOTO SOLD'),el('span','','ORBIS NEWS'));panel.append(bar);
const copy=el('div','copy');let payout=null;if(view==='popup'){panel.classList.add('payout-popup');if(pending)copy.append(el('p','pending','Waiting for your headline…'));else{copy.append(title(d));}const back=el('button','primary',pending?'SENDING…':'BACK TO THE CITY →');back.disabled=pending;back.onclick=()=>switchView('roll');copy.append(back);const photo=image(d,false);if(!pending){payout=el('strong','price payout-number','$0');photo.append(payout);}panel.append(photo,copy);}

else{copy.append(title(d));const reason=d.r.reason.replace(/^Another shot of this story[^.]*\. /,'');copy.append(el('p','explanation',reason));const grades=el('div','grades');for(const [k,name] of [['event','Impact'],['clarity','Clarity'],['spectacle','Spectacle']]){const col=el('div');col.append(el('small','',name),el('b','',d.g[k]+'/4'));grades.append(col);}copy.append(grades);const math=el('div','math');math.append(el('div','','Photo rating: '+d.base+'/10'));if(d.repeat)math.append(el('div','','Repeat photo · 50% payout'));math.append(el('strong','',money(d.paid)+' earned'));copy.append(math);const formula=el('details','formula-notes');formula.append(el('summary','','How ratings work'));formula.append(el('p','','1. Photo quality: (Impact + Spectacle) × Clarity ÷ 3.2 gives a rating out of 10. If Impact or Clarity is zero, the rating is zero.'),el('p','','2. Repeat adjustment: a repeat earns half that rating. A new story keeps the full rating.'));copy.append(formula);const body=el('div','viewer-body');body.append(image(d,false),copy);panel.append(body);const footer=el('div','viewer-footer');const prev=el('button','','← Previous'),next=el('button','','Next →'),back=el('button','','BACK TO RESULTS');prev.onclick=()=>step(-1);next.onclick=()=>step(1);back.onclick=()=>switchView('card');footer.append(prev,back,next);panel.append(footer);}stage.append(panel);if(payout)countPayout(payout,d.paid);}
function step(n){index=(index+n+shots.length)%shots.length;render();}
document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#pending').onclick=()=>{pending=!pending;render();};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});render();
</script></html>
