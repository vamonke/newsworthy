<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsworthy — Results designs</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#142d48;font-family:Barlow,Arial}header{border-top:6px solid #e6372f;background:#f8f4ea;padding:22px 32px;display:flex;align-items:center;gap:25px}header b{font:900 italic 32px 'Barlow Condensed'}header span{font-size:12px}nav{padding:20px 32px;display:flex;gap:8px;flex-wrap:wrap}button{font:700 12px Barlow;padding:10px 15px;border:1px solid #bdc6d0;background:#fff;color:#142d48;cursor:pointer}button[aria-pressed=true]{background:#154bae;color:white;border-color:#154bae}.count{margin-left:auto}main{max-width:1160px;margin:0 auto 40px;background:#f8f4ea;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:15px}.top h1{font:800 40px 'Barlow Condensed';margin:0}.top h1 small{font:600 12px Barlow;color:#6b7380;margin-left:12px;white-space:nowrap}.total{font:800 42px 'Barlow Condensed';color:#154bae}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;overflow:hidden;border:1px solid #d3d4ce;--accent:#607286;--ink:white}.card.big{--accent:#154bae}.card.scoop{--accent:#f1ba39;--ink:#432e00}.card.jackpot{--accent:#dc382d;--ink:white;border-color:#dc382d}.photo{position:relative}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.price{background:var(--accent);color:var(--ink);font:800 28px 'Barlow Condensed';padding:6px 11px;white-space:nowrap}.price .original-price{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;margin-right:7px;gap:1px}.price .original-price small{font:600 8px/1 Barlow,Arial;letter-spacing:0;opacity:.85}.price del{font:600 13px Barlow,Arial;opacity:.75;text-decoration-thickness:1px}.price small{display:block;font:800 9px Barlow;letter-spacing:.8px}.headline{font:700 16px/1.25 Barlow,Arial;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.caption{padding:11px;min-height:64px}.repeat{font:600 9px Barlow;opacity:.8;margin-left:6px}.badge .price{position:absolute;bottom:9px;right:9px;box-shadow:2px 2px 0 #0003}.inline .caption{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px}.inline .price{font-size:25px;padding:5px 8px}.inline .headline{flex:1}.banner .caption{background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px}.banner .price{padding:0;font-size:30px}.banner .headline{flex:1}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;padding:0 32px 20px}.legend b{color:#154bae}.note{font-size:12px;color:#627080;margin:14px 0 0}.footer{display:flex;justify-content:space-between;margin-top:20px;align-items:center}.footer span{font:800 12px Barlow;letter-spacing:1px}.footer button{background:#154bae;color:white}
@media(max-width:700px){header,nav{padding:15px}.legend{padding:0 15px 15px}main{padding:15px}.grid{gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:30px}.total{font-size:30px}.headline{font-size:14px}.price{font-size:23px}.count{margin-left:0}}

.promo .price{position:absolute;bottom:9px;right:9px;box-shadow:2px 2px 0 #0003;font-size:36px;line-height:1;padding:9px 11px}
.promo .price .original-price{vertical-align:bottom;align-items:flex-start;margin-right:9px;gap:5px}
.promo .original-price small{font-size:8px;letter-spacing:.5px}
.promo .price del{font-size:14px;line-height:1}
.promo .price>small{margin-bottom:4px}
.headline-repeat{display:inline-block;vertical-align:middle;font:700 8px/1 Barlow,Arial;letter-spacing:.3px;padding:4px 5px;background:#e9e9e3;color:#626e79;border-radius:3px;white-space:nowrap}.title-repeat .headline{display:block;overflow:visible}
.grades .headline{display:block;overflow:visible}.score-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.score-pills span{font:600 10px/1.2 Barlow,Arial;padding:4px 6px;border:1px solid #d6dfe7;border-radius:4px;background:#f1f5f8;color:#3d546b}
.score-columns .headline{display:block;overflow:visible}.caption>.score-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px;gap:0}.caption>.score-columns>span{padding:0 8px;text-align:center}.caption>.score-columns>span:first-child{padding-left:0}.caption>.score-columns>span+span{border-left:1px solid #d6dfe7}.score-columns small{display:block;font:500 10px/1.2 Barlow,Arial;color:#697582}.score-columns b{display:block;font:700 12px/1.3 Barlow,Arial;margin-top:3px}
.score-emojis .headline{display:block;overflow:visible}.score-emojis .score-columns>span{font-size:13px;line-height:20px;padding:0 3px;letter-spacing:-1px;white-space:nowrap}
.final-score .headline{display:block;overflow:visible}.quality-detail{margin-top:8px}.quality-detail summary{display:inline-block;font:700 11px Barlow,Arial;color:#154bae;cursor:pointer;border-bottom:1px dotted #8394a9;padding-bottom:2px}.quality-detail summary:focus-visible{outline:2px solid #154bae;outline-offset:3px}.quality-detail p{font:400 12px/1.5 Barlow,Arial;color:#536477;margin:9px 0 0}
.inline-rating{display:inline-block;vertical-align:baseline;font:600 12px/1.2 Barlow,Arial;color:#73808c;border:0;background:transparent;padding:0 2px;white-space:nowrap}.inline-rating:hover{color:#154bae}.inline-rating:focus-visible{outline:2px solid #154bae;outline-offset:3px}.rating-explanation{font:400 12px/1.5 Barlow,Arial;color:#536477;margin:9px 0 0}
</style>
<header><b>NEWSWORTHY</b><span>RESULTS · DESIGN COMPARISON</span></header>
<nav><button data-mode="minimal" aria-pressed="false">1 · Price only</button><button data-mode="repeat" aria-pressed="false">2 · Repeat label</button><button data-mode="explained" aria-pressed="false">3 · Repeat + rate</button><button data-mode="title-repeat" aria-pressed="false">4 · Repeat by headline</button><button data-mode="grades" aria-pressed="false">5 · Photo scores</button><button data-mode="score-columns" aria-pressed="false">6 · Score columns</button><button data-mode="score-emojis" aria-pressed="false">7 · Emoji scores</button><button data-mode="final-score" aria-pressed="true">8 · Price + details</button><button class="count" id="count" aria-pressed="false">Show 9 photos</button></nav>
<div class="legend">Photo payouts · Repeat photos earn half.</div>
<main><div class="top"><h1>Your front page.<small id="photo-count"></small></h1><strong class="total"></strong></div><div class="grid badge" id="grid"></div><p class="note" id="note"></p><div class="footer"><span>ORBIS NEWS</span><span>MAKE THE NEWS.</span></div></main>
<script>
const savedReasons={"Large Red Balloon Floats Above City Street": "A single large red sphere resembling a balloon is visible hovering above a busy city avenue, constituting a small curiosity.", "Large Red Sphere Floats Above City Street": "Another shot of this story \u00b7 50% rate ($300 \u2192 $150). This is a closer shot of the same large red sphere floating above the street seen in previous photo 0, continuing the same incident.", "Giant Frosted Pastry Blocks City Avenue": "An extraordinarily large frosted pastry-like object has appeared blocking a major street, distinct from the previous red balloon incident.", "Giant pastry blocks city street": "Another shot of this story \u00b7 50% rate ($800 \u2192 $400). The giant donut-like object from previous photo 1 has shifted position and is now blocking traffic at the intersection with multiple cars surrounding it. This is a continuing development of the same s", "Aircraft On Fire On City Street": "Visible severe aircraft crash with large flames and black smoke on an urban street.", "Aviation Incident and Fire": "Another shot of this story \u00b7 50% rate ($800 \u2192 $400). This is a closer, slightly different angle of the same burning aircraft wreck seen in previous photo 2, continuing the same major emergency incident.", "Red Balloon Plumes Smoke Above Massive Fire": "Another shot of this story \u00b7 50% rate ($500 \u2192 $250). The photo shows a large fire with billowing smoke alongside a red balloon floating in the air, representing a new development involving the red balloon from previous photo 0.", "Flying saucer spotted near downtown building": "A blue saucer-shaped UFO is visible hovering near a downtown building, completely distinct from previous fire and balloon incidents.", "Giant Duck and Pastry Land on Rooftop": "A giant yellow rubber duck and a massive pink frosted donut have appeared resting on a city building rooftop alongside previous surreal objects. This is a new distinct subject compared to previous photos.", "Massive Fireball and Wreckage Engulf Downtown Intersection": "Another shot of this story \u00b7 50% rate ($800 \u2192 $400). This shows a continuation of the massive fire disaster featuring the burning craft and glowing orb from photo 0, captured from a slightly different wider perspective."};
const savedGrades={"Large Red Balloon Floats Above City Street": {"event": 1, "clarity": 3, "spectacle": 1}, "Large Red Sphere Floats Above City Street": {"event": 1, "clarity": 4, "spectacle": 2}, "Giant Frosted Pastry Blocks City Avenue": {"event": 3, "clarity": 4, "spectacle": 3}, "Giant pastry blocks city street": {"event": 3, "clarity": 4, "spectacle": 3}, "Aircraft On Fire On City Street": {"event": 4, "clarity": 4, "spectacle": 4}, "Aviation Incident and Fire": {"event": 4, "clarity": 3, "spectacle": 4}, "Red Balloon Plumes Smoke Above Massive Fire": {"event": 3, "clarity": 3, "spectacle": 4}, "Flying saucer spotted near downtown building": {"event": 3, "clarity": 3, "spectacle": 3}, "Giant Duck and Pastry Land on Rooftop": {"event": 3, "clarity": 4, "spectacle": 3}, "Massive Fireball and Wreckage Engulf Downtown Intersection": {"event": 4, "clarity": 4, "spectacle": 4}};
const shots=JSON.parse(localStorage.getItem('newsworthy-design-shots')||'[]');let mode='final-score',nine=false;
for(const shot of shots){const g=savedGrades[shot.headline];if(!g)continue;const base=g.event===0||g.clarity===0?0:Math.round((g.event+g.spectacle)*g.clarity/32*1000)/100;shot.finalScore=Math.round(base*(shot.repeat?.5:1)*100)/100;shot.price='$'+Math.round(shot.finalScore*100).toLocaleString();}
function render(){const visible=shots.slice(0,nine?9:10),grid=document.querySelector('#grid');grid.className='grid badge '+mode;grid.replaceChildren();document.querySelector('#photo-count').textContent=visible.length+' photos';document.querySelector('.total').textContent='$'+visible.reduce((t,s)=>t+Number(s.price.replace(/[^0-9.]/g,'')),0).toLocaleString();document.querySelector('#note').textContent=nine?'Nine-photo preview · first nine shots from your round.':shots.length?'Your saved photos, recalculated with the new scoring. Colors reflect the final payout.':'No saved photos found. Open this page in the same browser as your game.';
for(const s of visible){const n=Number(s.price.replace(/[^0-9.]/g,'')),base=s.repeat?n*2:n,tier=n>=750?'jackpot':n>=500?'scoop':n>=250?'big':'standard',label=base>=800?'FRONT PAGE':'';const card=document.createElement('article');card.className='card '+tier;const photo=document.createElement('div');photo.className='photo';const img=new Image();img.src=s.image;img.alt=s.headline;photo.append(img);const caption=document.createElement('div');caption.className='caption';const headline=document.createElement('h2');headline.className='headline';headline.textContent=s.headline;if(s.repeat&&['title-repeat','grades','score-columns','score-emojis','final-score'].includes(mode)){const tag=document.createElement('span');tag.className='headline-repeat';tag.textContent='REPEAT';headline.append(document.createTextNode(' '),tag);}const price=document.createElement('div');price.className='price';if(s.repeat&&mode!=='minimal'&&mode!=='title-repeat'&&mode!=='grades'&&mode!=='score-columns'&&mode!=='score-emojis'&&mode!=='final-score'){const tag=document.createElement('small');tag.textContent=mode==='explained'?'REPEAT · 50% PAY':'REPEAT';price.append(tag);}price.append(document.createTextNode(s.price));caption.append(headline);if(mode==='final-score'&&savedGrades[s.headline]){const g=savedGrades[s.headline],score=g.event===0||g.clarity===0?0:Math.round((g.event+g.spectacle)*g.clarity/32*100);const rating=document.createElement('button');rating.className='inline-rating';rating.textContent='ⓘ';const explanation='Impact '+g.event+'/4 · Clarity '+g.clarity+'/4 · Spectacle '+g.spectacle+'/4. '+(savedReasons[s.headline]||'').replace(/^Another shot of this story[^.]*\. /,'');rating.title=explanation;rating.setAttribute('aria-label','View photo scoring details');rating.setAttribute('aria-expanded','false');const body=document.createElement('p');body.className='rating-explanation';body.hidden=true;body.textContent='AI photo rating. '+explanation+(s.repeat?' Repeat photo: rating halved.':'')+' Final rating '+s.finalScore+' × $100 = '+s.price+'.';rating.onclick=()=>{body.hidden=!body.hidden;rating.setAttribute('aria-expanded',String(!body.hidden));};const repeat=headline.querySelector('.headline-repeat');headline.insertBefore(document.createTextNode(' '),repeat);if(repeat)headline.insertBefore(document.createTextNode(' '),repeat);caption.append(body);}if(['grades','score-columns','score-emojis'].includes(mode)&&savedGrades[s.headline]){const scores=document.createElement('div');scores.className=['score-columns','score-emojis'].includes(mode)?'score-columns':'score-pills';for(const [key,name] of [['event','Event strength'],['clarity','Clarity'],['spectacle','Spectacle']]){const pill=document.createElement('span');if(mode==='score-emojis'){const score=savedGrades[s.headline][key];pill.textContent=score?({event:'💥',clarity:'🔍',spectacle:'✨'}[key]).repeat(score):'—';pill.title=(key==='event'?'Impact':name)+' '+score+'/4';pill.setAttribute('aria-label',pill.title);}else if(mode==='score-columns'){const label=document.createElement('small');label.textContent=key==='event'?'Impact':name;const value=document.createElement('b');value.textContent=savedGrades[s.headline][key]+'/4';pill.append(label,value);}else pill.textContent=name+' '+savedGrades[s.headline][key]+'/4';scores.append(pill);}caption.append(scores);}photo.append(price);card.append(photo,caption);grid.append(card)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});document.querySelector('#count').onclick=()=>{nine=!nine;document.querySelector('#count').textContent=nine?'Show 10 photos':'Show 9 photos';document.querySelector('#count').setAttribute('aria-pressed',nine);render()};render();
</script></html>
